name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Staged publishing needs npm >= 11.15.0; Node 22 ships npm 10.
      - run: npm install -g npm@^11.15.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: ./scripts/size-check.sh
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - name: Stage for publishing (prereleases go to the "next" dist-tag)
        # No token: npm authenticates this workflow via OIDC (npmjs.com → package Settings → Trusted Publisher).
        # The version is staged, not published: a maintainer approves it with 2FA on npmjs.com
        # (or `npm stage approve <stage-id>`) before it reaches the registry.
        run: npm stage publish --provenance --access public --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}
