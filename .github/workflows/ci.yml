name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
      - run: ./scripts/size-check.sh
      - name: Check package contents
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          grep -q 'lib/module/index.js' pack.txt
          grep -q 'lib/typescript/index.d.ts' pack.txt
          ! grep -q '__tests__' pack.txt
